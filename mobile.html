<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FY27 DAT Tech Summit · Boarding pass</title>
<style>
:root{--bg:#0a1830;--card:#0c1f3d;--line:#1d3a66;--cy:#2fd4f0;--tx:#cfe3f7;--mut:#9fc3e8;--or:#ffc978}
*{box-sizing:border-box;margin:0}
body{background:#050d1c;color:var(--tx);font-family:Arial,Helvetica,sans-serif;line-height:1.45}
.app{max-width:560px;margin:0 auto;background:var(--bg);min-height:100vh}
.hero{padding:20px 18px 14px;background:linear-gradient(180deg,#0f2a52,#0a1830)}
.kick{font-size:11px;letter-spacing:.22em;color:var(--cy);text-transform:uppercase}
.hero h2{color:#fff;font-weight:400;font-size:24px;margin:6px 0 2px}
.plain{font-size:14px;color:var(--mut)}
.route{display:flex;align-items:center;gap:10px;color:#fff;margin:14px 0 10px}
.route b{font-size:20px}
.route .ln{flex:1;border-top:2px dotted var(--cy);position:relative;height:0}
.plane{position:absolute;top:-8px;left:0;color:var(--cy);line-height:0;animation:fly 3.2s ease-in-out forwards}
@keyframes fly{from{left:0}to{left:calc(100% - 26px)}}
.cd{display:flex;gap:8px}
.cd div,.nn{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:7px 6px;text-align:center;flex:1}
.cd b{display:block;color:#fff;font-size:21px;font-variant-numeric:tabular-nums}
.cd span{font-size:10px;color:var(--mut);letter-spacing:.12em;text-transform:uppercase}
.nn{text-align:left;padding:9px 12px;color:#fff;font-size:15px}.nn small{display:block;font-size:10px;letter-spacing:.14em;color:var(--cy);text-transform:uppercase}
.cd2{font-size:13px;color:var(--mut);margin-top:7px}
.ticket{display:grid;margin:0 14px 12px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;grid-template-columns:repeat(4,1fr);gap:8px}
.ticket small{display:block;font-size:9px;letter-spacing:.16em;color:var(--mut)}.ticket b{color:#fff;font-size:14px}
.tabs{display:flex;background:#081327;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.tabs button{flex:1;background:none;border:0;border-bottom:2px solid transparent;color:var(--mut);font-size:15px;padding:13px 6px;cursor:pointer;font-family:inherit}
.tabs button.on{color:var(--cy);border-bottom-color:var(--cy)}
.sec{display:none;padding:16px}.sec.on{display:block}
h3{color:#fff;font-weight:400;font-size:19px;margin-bottom:10px}
.note{font-size:13px;color:var(--or);margin:8px 0}
.chk{display:flex;gap:10px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:11px 12px;margin-bottom:8px;font-size:15px;cursor:pointer}
.chk input{margin-top:3px;accent-color:#2fd4f0}.chk.done{opacity:.55;text-decoration:line-through}
.due{display:block;font-size:12.5px;color:var(--or);margin-top:2px}
.prog{height:6px;background:#12294d;border-radius:4px;margin:4px 0 12px;overflow:hidden}.prog i{display:block;height:100%;background:var(--cy);width:0;transition:width .5s}
.btn{display:inline-block;margin-top:7px;background:transparent;border:1px solid var(--cy);color:var(--cy);border-radius:14px;padding:6px 14px;font-size:14px;cursor:pointer;font-family:inherit;text-decoration:none}
.dayb{display:flex;gap:6px;margin-bottom:10px}
.dayb button{flex:1;background:var(--card);border:1px solid var(--line);color:var(--tx);border-radius:8px;padding:8px;font-size:14px;cursor:pointer;font-family:inherit}
.dayb button.on{border-color:var(--cy);color:var(--cy)}
.board{background:#050d1c;border:1px solid var(--line);border-radius:8px;padding:6px}
.row{display:flex;gap:10px;padding:7px 6px;border-bottom:1px solid #112544;font-family:"Courier New",monospace;font-size:14px;color:#ffd36b}
.row:last-child{border:0}.row .t{width:48px;color:var(--cy);flex:none}.row .n{flex:1;color:#ffe9a8}
.row.now{outline:1px solid var(--cy);border-radius:4px}.row.past{opacity:.4}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin-bottom:10px;font-size:15px}
.card b{color:#fff}.card a{color:var(--cy)}
.tag{display:inline-block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;border:1px solid var(--cy);color:var(--cy);border-radius:10px;padding:1px 8px;margin-bottom:6px}
details{margin:6px 0 12px}
summary{cursor:pointer;list-style:none;background:var(--card);border:1px solid var(--cy);border-radius:10px;padding:12px 14px;color:#fff;font-size:16px}
summary::-webkit-details-marker{display:none}summary:after{content:"+";float:right;color:var(--cy);font-size:20px;line-height:1}
details[open] summary:after{content:"–"}
details .in{padding-top:10px}
@media(min-width:900px){
 .app{max-width:1180px}
 .hero{padding:26px 36px 18px;display:grid;grid-template-columns:1fr 1fr;gap:6px 40px;align-items:center}
 .hero h2{font-size:32px}.hero .left{grid-column:1}.hero .right{grid-column:2}
 .tabs{display:none}
 #secs{display:grid;grid-template-columns:1fr 1.15fr;gap:8px 32px;padding:20px 36px}
 .sec{display:block;padding:8px 0}.s-agenda{grid-column:2;grid-row:1/span 2}.s-pre{grid-column:1}.s-log{grid-column:1}
 .row{font-size:15px;padding:8px}
}
.wx-now{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:14px;color:var(--mut)}.wx-now b{color:#fff;font-size:18px}
.wx-now svg{width:28px;height:28px}
.wx-days{display:flex;gap:8px;margin-top:8px}.wx-days div{flex:1;background:#081327;border:1px solid var(--line);border-radius:8px;padding:8px;text-align:center;font-size:13px;color:var(--mut)}.wx-days svg{width:30px;height:30px;display:block;margin:2px auto}.wx-days b{color:#fff}
.sight{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.sight .btn{margin-top:0;flex:none;padding:5px 11px;font-size:13px}
.sight p{margin:2px 0 0;color:var(--tx);font-size:14px}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style></head><body><div class="app">
<div class="hero">
 <div class="left"><div class="kick">FY27 DAT Tech Summit · Inbound flight</div><h2>DAT Tech Summit</h2><div class="plain">Kraków · 16–17 December 2026</div>
 <div class="route"><b>WORLD</b><span class="ln"><span class="plane" id="plane"><svg viewBox="0 0 30 16" width="26" height="14"><path fill="currentColor" d="M2 6h6l-3-5h3l6 5h9c3 0 5 1.5 5 2s-2 2-5 2h-9l-6 5H5l3-5H2z"/></svg></span></span><b>KRK</b></div></div>
 <div class="right"><div class="cd" id="cd"></div><div class="cd2" id="cd2"></div><div class="wx-now"></div></div>
</div>
<div class="ticket"><div><small>DATE</small><b>16 Dec</b></div><div><small>BOARDING</small><b>08:00</b></div><div><small>DEPARTURE</small><b>09:00</b></div><div><small>GATE</small><b>Kraków</b></div></div>
<div class="tabs" id="tabs"></div>
<div id="secs"></div></div>
<script>
const AG={
1:[["08:00","Arrival and breakfast (bus from the Sheraton)"],["09:00","Tech Summit Executive Kick Off"],["10:00","Agentic Workforce: Intro"],["10:30","Break"],["11:00","Agentic Workforce: Demo"],["11:30","Agentic Workforce: Hands On"],["12:30","Lunch (catering)"],["13:30","New SOW Tool Demo"],["14:30","Session 2: My Agent"],["15:30","Technical Activation & Graduation"],["16:30","Closing Day 1"],["17:00","Commute / free time"],["18:00","Team Event"]],
2:[["08:00","Arrival and breakfast (bus from the Sheraton)"],["09:00","MAGIC"],["10:00","Break"],["10:30","Proactive Renewals"],["11:30","People, Purpose, Growth: DAT Scorecard"],["12:30","Lunch (catering)"],["13:15","Special Guest: Adele (SVP, CX)"],["13:45","Cisco IQ and RIS"],["14:45","Break"],["15:15","Uplevel DAT Scoping / AI Scalable Large Deals"],["16:15","Portfolio or Tooling (to be decided)"],["17:00","Closing Day 2 + pledge round"],["17:30","Commute / free time"],["18:10","Team Event"]]};
const D={1:"2026-12-16",2:"2026-12-17"};
const qp=new URLSearchParams(location.search),sim=qp.get("d");let day=1,tab=qp.get("t")||"pre";
const $=s=>document.querySelector(s),now=()=>sim?new Date(sim):new Date();
const summit=()=>{const n=now();return n>=new Date("2026-12-16T00:00:00+01:00")&&n<new Date("2026-12-18T00:00:00+01:00")};
const autoDay=()=>now()>=new Date("2026-12-17T00:00:00+01:00")?2:1;
const ROOMS={};
function ics(){const t="BEGIN:VCALENDAR\nVERSION:2.0\nPRODID:-//DAT//Summit//EN\nBEGIN:VEVENT\nUID:dat-tech-summit-fy27@dat\nDTSTAMP:20261101T000000Z\nDTSTART:20261216T070000Z\nDTEND:20261217T160000Z\nSUMMARY:FY27 DAT Tech Summit, Kraków\nDESCRIPTION:Times to be confirmed\nEND:VEVENT\nEND:VCALENDAR";const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([t],{type:"text/calendar"}));a.download="DAT_Tech_Summit.ics";a.click()}
const MAP=q=>"https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(q);
function ico(k){const c={clear:'<circle cx="16" cy="16" r="6" fill="#ffd36b"/><g stroke="#ffd36b" stroke-width="2"><path d="M16 3v4M16 25v4M3 16h4M25 16h4M7 7l3 3M22 22l3 3M25 7l-3 3M10 22l-3 3"/></g>',
 cloud:'<path d="M9 23h14a5 5 0 0 0 0-10 7 7 0 0 0-13.5 1.5A4.3 4.3 0 0 0 9 23z" fill="#9fc3e8"/>',
 partly:'<circle cx="12" cy="11" r="5" fill="#ffd36b"/><path d="M10 25h14a4.5 4.5 0 0 0 0-9 6 6 0 0 0-11.5 1.2A3.9 3.9 0 0 0 10 25z" fill="#cfe3f7"/>',
 fog:'<path d="M5 12h22M8 17h19M5 22h22" stroke="#9fc3e8" stroke-width="2.5" stroke-linecap="round"/>',
 rain:'<path d="M9 17h14a4.5 4.5 0 0 0 0-9 6 6 0 0 0-11.5 1.2A3.9 3.9 0 0 0 9 17z" fill="#9fc3e8"/><path d="M11 21l-2 5M17 21l-2 5M23 21l-2 5" stroke="#2fd4f0" stroke-width="2" stroke-linecap="round"/>',
 snow:'<path d="M9 17h14a4.5 4.5 0 0 0 0-9 6 6 0 0 0-11.5 1.2A3.9 3.9 0 0 0 9 17z" fill="#9fc3e8"/><g fill="#fff"><circle cx="10" cy="23" r="1.8"/><circle cx="16" cy="26" r="1.8"/><circle cx="22" cy="23" r="1.8"/></g>',
 storm:'<path d="M9 17h14a4.5 4.5 0 0 0 0-9 6 6 0 0 0-11.5 1.2A3.9 3.9 0 0 0 9 17z" fill="#7f95b5"/><path d="M17 18l-4 6h4l-2 5 6-7h-4z" fill="#ffd36b"/>'}[k]||'';
 return `<svg viewBox="0 0 32 32" aria-hidden="true">${c}</svg>`}
const wmo=c=>c===0?"clear":c<=2?"partly":c===3?"cloud":c<=48?"fog":c<=57?"rain":c<=67?"rain":c<=77?"snow":c<=82?"rain":c<=86?"snow":"storm";
const txt=d=>{d=(d||"").toLowerCase();return /thunder/.test(d)?"storm":/snow|sleet|ice|blizzard/.test(d)?"snow":/rain|drizzle|shower/.test(d)?"rain":/fog|mist|haze/.test(d)?"fog":/partly|sunny intervals/.test(d)?"partly":/cloud|overcast/.test(d)?"cloud":/sun|clear/.test(d)?"clear":"cloud"};
let WX=null;
function paintWeather(){document.querySelectorAll(".wx-now").forEach(e=>{e.innerHTML=WX?`${ico(WX.now.k)}<span><b>${WX.now.t}°C</b> in Kraków now</span>`:""});
 document.querySelectorAll(".wx-days").forEach(e=>{e.innerHTML=WX&&WX.days?Object.keys(WX.days).map(k=>`<div>${k==="2026-12-16"?"Wed 16 Dec":"Thu 17 Dec"}${ico(WX.days[k].k)}<b>${WX.days[k].max}°</b> / ${WX.days[k].min}°</div>`).join(""):""})}
async function getJ(u,ms){const c=new AbortController(),t=setTimeout(()=>c.abort(),ms);try{const r=await fetch(u,{signal:c.signal});if(!r.ok)throw 0;return await r.json()}finally{clearTimeout(t)}}
async function loadWeather(){
 try{const j=await getJ("https://api.open-meteo.com/v1/forecast?latitude=50.0647&longitude=19.945&current=temperature_2m,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min&timezone=Europe%2FWarsaw&forecast_days=16",6000);
  WX={now:{t:Math.round(j.current.temperature_2m),k:wmo(j.current.weather_code)},days:{}};
  j.daily.time.forEach((d,i)=>{if(d==="2026-12-16"||d==="2026-12-17")WX.days[d]={max:Math.round(j.daily.temperature_2m_max[i]),min:Math.round(j.daily.temperature_2m_min[i]),k:wmo(j.daily.weather_code[i])}});
 }catch(e){try{const j=await getJ("https://wttr.in/Krakow?format=j1",6000),c=j.current_condition[0];WX={now:{t:+c.temp_C,k:txt(c.weatherDesc[0].value)},days:null}}catch(e2){WX=null}}
 paintWeather()}
function render(){
 const items=[["Add the summit to your calendar","cal"],["Write your Wins wall sentence","Slido link TBC"],["Watch Adele's MAGIC video (about 5 min)","link TBC"],["Watch the MCP and DDM Copilot videos (3 min in total)","links TBC"],["My Agent: enable the Outlook, Webex and SharePoint connectors, and watch the 2-minute skill video","links TBC"]];
 const st=JSON.parse(localStorage.getItem("bp-chk2")||"{}"),done=items.filter((_,i)=>st[i]).length;
 const pre=`<h3>Pre work</h3><div class="prog"><i style="width:${Math.round(done/items.length*100)}%"></i></div>`+items.map((it,i)=>`<label class="chk ${st[i]?"done":""}"><input type="checkbox" data-i="${i}" ${st[i]?"checked":""}><span>${it[0]}${it[1]==="cal"?'<br><button class="btn" onclick="event.preventDefault();ics()">Add to calendar</button>':`<span class="due">Do by [date TBC] · ${it[1]}</span>`}</span></label>`).join("")+`<div class="note">Ticks stay on your phone only. Dates and links to be confirmed by the session owners.</div>`;
 const n=now();
 const rows=AG[day].map((r,i)=>{const dt=new Date(D[day]+"T"+r[0]+":00+01:00"),nx=AG[day][i+1]?new Date(D[day]+"T"+AG[day][i+1][0]+":00+01:00"):new Date(D[day]+"T23:59:00+01:00");const isNow=n>=dt&&n<nx,past=summit()&&n>=nx;return `<div class="row ${isNow?"now":""} ${past?"past":""}"><span class="t" data-f="${r[0]}">${r[0]}</span><span class="n" data-f="${r[1]}">${r[1]}</span></div>`}).join("");
 const agenda=`<h3>Agenda</h3><div class="dayb"><button data-d="1" class="${day==1?"on":""}">Wed 16 Dec</button><button data-d="2" class="${day==2?"on":""}">Thu 17 Dec</button></div><div class="board">${rows}</div><div class="note">All times are Kraków time (CET). Timings are still subject to review with each topic owner.</div>`;
 const rooms=Object.keys(ROOMS).length?`<div class="card"><b>Rooms</b><br>${Object.entries(ROOMS).map(([k,v])=>k+": "+v).join("<br>")}</div>`:"";
 const log=`<h3>Logistics</h3>
 <div class="card"><b>Cisco Kraków office</b><br>Aleja Powstańców Wielkopolskich 13C, Enterprise Park, Building C, 30-707 Kraków<br><a class="btn" target="_blank" rel="noopener" href="${MAP("Aleja Powstańców Wielkopolskich 13C 30-707 Kraków")}">Open in Maps</a></div>${rooms}
 <div class="card"><b>Lunch</b> is catered at the office on both days. <b>Laptops:</b> where to leave them is <span class="note">TBC</span>.</div>
 <div class="card"><span class="tag">Wed 16 Dec</span><br>Team event straight after the day. Transport details <span class="note">TBC</span>.</div>
 <div class="card"><span class="tag">Thu 17 Dec</span><br>Dinner at a rooftop restaurant, about a 15-minute walk from the hotel. Bring a warm coat. If you prefer not to walk, take an Uber from the hotel <span class="note">(TBC)</span>.</div>
 <details><summary>Travelling to Kraków?</summary><div class="in">
 <div class="card"><b>Hotel: Sheraton Grand Kraków</b><br>ul. Powiśle 7, 31-101 Kraków. Breakfast is included.<br><a class="btn" target="_blank" rel="noopener" href="${MAP("Sheraton Grand Krakow Powiśle 7 Kraków")}">Open in Maps</a></div>
 <div class="card"><b>From the airport to the hotel</b><br>Uber and Bolt both work. Taxis outside arrivals are usually more expensive. <span class="note">(Tips to be confirmed.)</span></div>
 <div class="card"><b>Hotel to the office</b><br>A bus runs from the hotel in the morning, about 08:00 <span class="note">(time TBC)</span>, and back after the day.</div>
 <div class="card"><b>Weather</b><div class="wx-now"></div><div class="wx-days"></div>December in Kraków is usually cold. Pack a warm coat, hat and gloves, and shoes for wet or icy streets.<br><a class="btn" target="_blank" rel="noopener" href="https://www.timeanddate.com/weather/poland/krakow/ext">Check the forecast</a></div>
 </div></details>
 <details><summary>Discover Kraków</summary><div class="in">
 <div class="card"><b>A short history</b><br>Kraków was the capital of Poland until the late 16th century, and its historic centre is a UNESCO World Heritage site. Wawel Castle is right by the hotel, and the Old Town is within walking distance.</div>
 <div class="card"><div class="sight"><div><b>Wawel Castle and Cathedral</b><p>The royal residence and the cathedral where Polish kings were crowned. Look for the Wawel Dragon statue by the river.</p></div><a class="btn" target="_blank" rel="noopener" href="${MAP("Wawel Castle Kraków")}">Map</a></div></div>
 <div class="card"><div class="sight"><div><b>Main Market Square</b><p>A huge medieval square with St Mary's Basilica and the Cloth Hall. A trumpet call plays from the basilica tower every hour. In December there is usually a Christmas market <span class="note">(dates TBC)</span>.</p></div><a class="btn" target="_blank" rel="noopener" href="${MAP("Main Market Square Kraków")}">Map</a></div></div>
 <div class="card"><div class="sight"><div><b>Kazimierz</b><p>The former Jewish quarter, now full of cafés and small restaurants. Try a zapiekanka, a long toasted baguette, at Plac Nowy.</p></div><a class="btn" target="_blank" rel="noopener" href="${MAP("Plac Nowy Kazimierz Kraków")}">Map</a></div></div>
 <div class="card"><div class="sight"><div><b>Schindler's Factory museum</b><p>The story of Kraków during the Second World War. Book tickets ahead.</p></div><a class="btn" target="_blank" rel="noopener" href="${MAP("Oskar Schindler's Enamel Factory Kraków")}">Map</a></div></div>
 <div class="card"><div class="sight"><div><b>Vistula boulevards and the Planty</b><p>An easy walk along the river, and the park that circles the Old Town.</p></div><a class="btn" target="_blank" rel="noopener" href="${MAP("Planty Park Kraków")}">Map</a></div></div>
 <div class="card"><div class="sight"><div><b>Wieliczka Salt Mine</b><p>An underground world outside the city. Allow half a day and book ahead, so it suits a longer stay.</p></div><a class="btn" target="_blank" rel="noopener" href="${MAP("Wieliczka Salt Mine")}">Map</a></div></div>
 <div class="card"><b>Try</b><br>Pierogi (filled dumplings), obwarzanek (a ring-shaped bread sold from street carts) and a zapiekanka.</div>
 <div class="card"><b>Short on time?</b><br>Free windows are short: Wed 17:00 to 18:00 and Thu 17:30 to 18:10. Wawel and the Old Town fit best. Opening hours and ticket rules change, so check before you go. <a target="_blank" rel="noopener" href="https://www.krakow.travel/en">Visit Kraków</a></div>
 </div></details>
 <div class="card"><b>Help</b><br>Logistics team: on site at the office <span class="note">(contact TBC)</span><br>Emergency in Poland: <b>112</b></div>`;
 const T=[["pre","Pre work",pre],["agenda","Agenda",agenda],["log","Logistics",log]];
 $("#tabs").innerHTML=T.map(x=>`<button data-t="${x[0]}" class="${x[0]===tab?"on":""}">${x[1]}</button>`).join("");
 $("#secs").innerHTML=T.map(x=>`<div class="sec s-${x[0]} ${x[0]===tab?"on":""}">${x[2]}</div>`).join("");
 document.querySelectorAll("#tabs button").forEach(b=>b.onclick=()=>{tab=b.dataset.t;render()});
 document.querySelectorAll(".chk input").forEach(c=>c.onchange=()=>{const s=JSON.parse(localStorage.getItem("bp-chk2")||"{}");s[c.dataset.i]=c.checked;localStorage.setItem("bp-chk2",JSON.stringify(s));render()});
 document.querySelectorAll(".dayb button").forEach(b=>b.onclick=()=>{day=+b.dataset.d;render()});
 flip();paintWeather();
}
function flip(){const bd=document.querySelector(".board");if(!bd||matchMedia("(prefers-reduced-motion:reduce)").matches)return;
 const go=()=>{const ch="ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789:";bd.querySelectorAll("[data-f]").forEach((el,k)=>{const f=el.dataset.f;let i=0;const iv=setInterval(()=>{i++;el.textContent=f.split("").map((c,j)=>c===" "||j<i-4?c:ch[Math.floor(Math.random()*ch.length)]).join("");if(i>f.length+4){el.textContent=f;clearInterval(iv)}},40+k*3)})};
 const r=bd.getBoundingClientRect();if(r.top>innerHeight*.85){new IntersectionObserver((e,o)=>{if(e[0].isIntersecting){o.disconnect();go()}}).observe(bd)}else go()}
function nowNext(){const n=now(),A=AG[autoDay()],d=D[autoDay()];let idx=-1;A.forEach((r,i)=>{if(n>=new Date(d+"T"+r[0]+":00+01:00"))idx=i});const c=idx>=0?A[idx]:null,x=A[idx+1];
 return `<div class="nn"><small>Now</small>${c?c[1]:"Doors open soon"}</div><div class="nn"><small>Next</small>${x?x[0]+" · "+x[1]:"That's a wrap for today"}</div>`}
function countdown(){const t=new Date("2026-12-16T09:00:00+01:00"),n=now(),ms=t-n;
 if(ms<=0){if(summit()){$("#cd").innerHTML=nowNext();$("#cd2").textContent="Kraków time (CET)"}else{$("#cd").innerHTML="";$("#cd2").textContent="Thank you for flying with us."}return}
 const d=Math.floor(ms/864e5),h=Math.floor(ms%864e5/36e5),m=Math.floor(ms%36e5/6e4);
 $("#cd").innerHTML=`<div><b>${d}</b><span>days</span></div><div><b>${h}</b><span>hours</span></div><div><b>${m}</b><span>min</span></div>`;$("#cd2").textContent="Boarding: Wed 16 Dec, 09:00 (Kraków time)"}
loadWeather();day=summit()?autoDay():1;countdown();setInterval(countdown,30000);render();
</script></body></html>
